syntax = "proto3";

package frame_scope;

// FrameMeta 可作为 ZMQ 多部分消息的第二段
// ZMQ 分段顺序固定为 topic、FrameMeta、图像负载

// 图像负载的编码方式
enum PayloadEncoding {
  PAYLOAD_ENCODING_UNSPECIFIED = 0;  // 未声明编码方式，接收端不可直接解析负载
  PAYLOAD_ENCODING_RAW = 1;          // 共享内存发布端当前使用的原始像素数据
  PAYLOAD_ENCODING_JPEG = 2;         // ZMQ 发布端当前使用的单帧 JPEG 数据
  PAYLOAD_ENCODING_H264 = 3;         // 预留的视频编码格式
  PAYLOAD_ENCODING_H265 = 4;         // 预留的视频编码格式
}

// 时间戳采用的时钟域；只有相同时钟域的时间戳才能直接计算差值
enum TimestampDomain {
  TIMESTAMP_DOMAIN_UNSPECIFIED = 0;  // 未声明时钟域，不可用于跨时间戳计算
  TIMESTAMP_DOMAIN_MONOTONIC = 1;    // 当前发布端的 steady_clock 时间
  TIMESTAMP_DOMAIN_UNIX_EPOCH = 2;   // Unix Epoch 墙上时钟时间
}

// payload 解码后的像素排列
enum PixelFormat {
  PIXEL_FORMAT_UNSPECIFIED = 0;  // 未声明像素排列，接收端不可直接重建图像
  PIXEL_FORMAT_BGR8 = 1;         // 当前采集链路输出的 OpenCV BGR 图像
  PIXEL_FORMAT_RGB8 = 2;         // 8 位 RGB 三通道图像
  PIXEL_FORMAT_GRAY8 = 3;        // 8 位单通道灰度图像
  PIXEL_FORMAT_NV12 = 4;         // Y 平面与交错 UV 平面的 4:2:0 图像
  PIXEL_FORMAT_YUV420P = 5;      // Y、U、V 独立平面的 4:2:0 图像
  PIXEL_FORMAT_BGRA8 = 6;        // 8 位 BGRA 四通道图像
  PIXEL_FORMAT_RGBA8 = 7;        // 8 位 RGBA 四通道图像
}

// 图像采用的色彩空间
enum ColorSpace {
  COLOR_SPACE_UNSPECIFIED = 0;  // 未声明色彩空间
  COLOR_SPACE_SRGB = 1;         // 当前发布端填充的默认色彩空间
  COLOR_SPACE_BT601 = 2;        // SDTV 常用的 BT.601 色彩空间
  COLOR_SPACE_BT709 = 3;        // HDTV 常用的 BT.709 色彩空间
  COLOR_SPACE_BT2020 = 4;       // UHDTV 常用的 BT.2020 色彩空间
}

// FrameMeta 的结构版本，与共享内存 Envelope 的传输版本相互独立
enum SchemaVersion {
  SCHEMA_VERSION_UNSPECIFIED = 0;  // 未声明协议版本
  SCHEMA_VERSION_V2 = 2;           // 当前发布端使用的协议版本
}

// 解码后图像的尺寸和内存布局
message ImageSpec {
  // 图像尺寸
  uint32 width = 1;              // 图像列数，单位为像素
  uint32 height = 2;             // 图像行数，单位为像素
  uint32 channels = 3;           // 每个像素的通道数

  // 内存布局
  uint32 stride_bytes = 4;       // 相邻两行起始地址的字节跨度
  uint32 bytes_per_channel = 5;  // 单个通道元素占用的字节数

  // 像素语义
  PixelFormat pixel_format = 6;  // payload 解码后的像素排列
  ColorSpace color_space = 7;    // 图像使用的色彩空间
}

// 随 FrameMeta 一同传输的图像负载信息
message PayloadSpec {
  // 编码方式
  PayloadEncoding encoding = 1;  // payload 使用的编码方式

  // 负载大小与解码属性
  uint64 payload_bytes = 2;       // 当前编码负载的实际字节数
  uint64 uncompressed_bytes = 3;  // 解码后图像连续存储时的字节数
  bool key_frame = 4;             // 当前帧能否脱离其他帧独立解码

  // 完整性校验
  uint32 crc32 = 5;  // 负载 CRC32；0 表示当前未启用校验

  // 分片信息
  uint32 fragment_index = 6;  // 当前分片索引，未分片时为 0
  uint32 fragment_count = 7;  // 总分片数，未分片时为 1
}

// 采集、排队和发布阶段的时间信息
message Timing {
  // 采集时间
  uint64 capture_timestamp_ns = 1;                // 采集回调收到该帧时的时间戳
  TimestampDomain capture_timestamp_domain = 2;   // 采集时间戳的时钟域

  // 发布时间
  uint64 publish_timestamp_ns = 3;                // 写入共享内存或发送 ZMQ 消息前的时间戳
  TimestampDomain publish_timestamp_domain = 4;   // 发布时间戳的时钟域

  // 链路耗时
  uint64 enqueue_latency_us = 5;   // 从采集回调到发布线程开始处理的耗时
  uint64 pipeline_latency_us = 6;  // 从采集回调到发布前的总耗时
  uint64 encode_latency_us = 7;    // 图像编码耗时；RAW 负载为 0
}

// 发布端按统计窗口计算的流状态
message StreamStats {
  double fps = 1;             // 窗口内的发布帧率
  double bandwidth_mbps = 2;  // 窗口内的 payload 带宽，单位为 Mbit/s
  uint64 dropped_frames = 3;  // 新采集帧覆盖待发布帧的累计次数
  uint32 window_ms = 4;       // 统计窗口长度，单位为毫秒
}

// 发布端随每帧生成的顶层元数据，供接收端重建图像并展示运行指标
message FrameMeta {
  // 来源标识
  string source_id = 1;   // 相机名，对应配置中的 camera.name
  string session_id = 2;  // 发布进程本次运行的会话标识

  // 帧序列
  uint64 frame_index = 3;       // 单个数据源内递增的帧编号
  uint64 publish_sequence = 4;  // SHM 中对应稳定态 Envelope.sequence；ZMQ 中等于 frame_index

  // 协议与图像数据
  SchemaVersion schema_version = 5;  // 当前元数据采用的结构版本
  ImageSpec image = 6;               // 解码后图像的尺寸与内存布局
  PayloadSpec payload = 7;           // 图像负载的编码与大小信息

  // 运行信息
  Timing timing = 8;            // 当前帧的时间戳与链路耗时
  StreamStats stats = 9;        // 当前数据源的发布统计

  // 保留原 field number，避免协议升级时被误用
  reserved 10;
  reserved "transport";

  // 追踪信息
  string trace_id = 11;  // 发布端生成的帧追踪标识
}